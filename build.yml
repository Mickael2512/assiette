name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project Assiette.xcodeproj -scheme Assiette -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Assiette.app Payload/
          zip -r Assiette.ipa Payload
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: Assiette-ipa
          path: Assiette.ipa
