name: Assiette
options:
  bundleIdPrefix: app.assiette
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Assiette:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: ["project.yml", "build.yml", "README.md", ".github", "Config"]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Assiette
        UILaunchScreen: {}
        NSCameraUsageDescription: Pour photographier vos plats, recettes et codes-barres.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.assiette.ios
        TARGETED_DEVICE_FAMILY: "1"
